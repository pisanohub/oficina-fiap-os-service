spring:
  application:
    name: os-service

  cloud:
    openfeign:
      client:
        config:
          execucao-service:
            url: ${OPEN_FEIGN_EXECUCAO_URL:http://localhost:8080}

    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY:test}
        secret-key: ${AWS_SECRET_KEY:test}
      sqs:
        endpoint: ${AWS_SQS_ENPOINT:http://localhost:4566}
        queue-not-found-strategy: CREATE
        listener:
          auto-startup: true
          max-messages-per-poll: 10
          poll-timeout: 10s


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/os_service}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

#server:
#  port: 9090

aws:
  sqs:
    create-queues: true
    url:
      in:
        billing:
          orcamento-respondido: orcamento-respondido
          pagamento-confirmado: pagamento-confirmado
        execucao: execucao-resultados
      out:
        billing:
          gerar-orcamento: gerar-orcamento
          processar-pagamento: processar-pagamento
        execucao: execucao-comandos

jwt:
  secret: ${JWT_SECRET:sua-chave-secreta-com-minimo-32-caracteres}
  expiration: 86400000 # 24h em ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


